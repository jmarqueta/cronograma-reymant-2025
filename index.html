<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cronograma de proyectos — Gantt (1 archivo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 UMD + ReactDOM + Babel (JSX en navegador) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body{background:#0b1020}
      .card{background:white}
    </style>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      // Iconos inline (sustituyen lucide-react)
      const IconPlus = (props) => (
        <svg width="16" height="16" viewBox="0 0 24 24" {...props}><path fill="currentColor" d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/></svg>
      );
      const IconTrash = (props) => (
        <svg width="16" height="16" viewBox="0 0 24 24" {...props}><path fill="currentColor" d="M9 3h6l1 2h5v2H3V5h5l1-2zm-1 6h2v10H8V9zm6 0h2v10h-2V9z"/></svg>
      );
      const IconCalendar = (props) => (
        <svg width="16" height="16" viewBox="0 0 24 24" {...props}><path fill="currentColor" d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3V2zm13 8H4v10h16V10z"/></svg>
      );

      // Utilidades de fechas
      const dayMs = 24 * 60 * 60 * 1000;
      const addDays = (date, n) => { const d=new Date(date); d.setDate(d.getDate()+n); d.setHours(0,0,0,0); return d; };
      const parseISODate = (iso) => { const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d)); const local=new Date(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()); local.setHours(0,0,0,0); return local; };
      const diffDays = (a,b) => Math.floor((a-b)/dayMs);
      const isWeekend = (date) => { const day=date.getDay(); return day===0 || day===6; };
      const addBusinessDays = (startDate, n) => { let d=new Date(startDate); let added=0; while(added<n){ d=addDays(d,1); if(!isWeekend(d)) added++; } return d; };
      const fmtDMY = (d) => d.toLocaleDateString(undefined, {year:"numeric", month:"short", day:"2-digit"}).replace(",","");

      const STATUS = [
        { value: "Pendiente", fill: "#facc15" },
        { value: "En curso", fill: "#3b82f6" },
        { value: "Completado", fill: "#10b981" },
      ];
      const STATUS_COLOR = Object.fromEntries(STATUS.map(s=>[s.value,s.fill]));
      const BASE_CLIENTES = ["Leroy", "Mantotal", "Particular"];

      const ejemplo = [
        { id: crypto.randomUUID(), nombre: "Lanzamiento web", inicio: new Date(), inicioISO: new Date().toISOString().slice(0,10), duracion: 14, estado: "En curso", cliente: "Leroy" },
        { id: crypto.randomUUID(), nombre: "Campaña marketing", inicio: addDays(new Date(), 5), inicioISO: addDays(new Date(),5).toISOString().slice(0,10), duracion: 21, estado: "Pendiente", cliente: "Particular" },
        { id: crypto.randomUUID(), nombre: "Formación equipo", inicio: addDays(new Date(), -10), inicioISO: addDays(new Date(),-10).toISOString().slice(0,10), duracion: 7, estado: "Completado", cliente: "Mantotal" },
      ];

      function App(){
        // Datos
        const [proyectos, setProyectos] = useState(ejemplo);
        const [clientes, setClientes] = useState(BASE_CLIENTES);
        const [nuevo, setNuevo] = useState({ nombre: "", inicioISO: new Date().toISOString().slice(0,10), duracion: 7, estado: "Pendiente", cliente: BASE_CLIENTES[0] });

        // UI
        const [showClientesPanel, setShowClientesPanel] = useState(false);

        // Rangos
        const { minInicio, maxFin, spanDias } = useMemo(()=>{
          if (proyectos.length===0){
            const today=new Date(); today.setHours(0,0,0,0);
            return { minInicio: today, maxFin: addDays(today, 30), spanDias: 31 };
          }
          const starts = proyectos.map(p=>p.inicio);
          const ends   = proyectos.map(p=>addBusinessDays(p.inicio, Math.max(1,p.duracion)-1));
          const minInicio = new Date(Math.min(...starts.map(d=>d.getTime())));
          const maxFin    = new Date(Math.max(...ends.map(d=>d.getTime())));
          minInicio.setHours(0,0,0,0); maxFin.setHours(0,0,0,0);
          return { minInicio, maxFin, spanDias: diffDays(maxFin, minInicio)+1 };
        }, [proyectos]);

        // Layout
        const layout = useMemo(()=>{
          const leftCol=260, rightPad=24, bottomAxis=60, rowH=48, rowGap=10, pxPerDay=24;
          const chartW = Math.max(600, spanDias*pxPerDay);
          const neededHeight = 32 + proyectos.length*(rowH+rowGap) + bottomAxis;
          const viewportH=420;
          return { leftCol, rightPad, bottomAxis, rowH, rowGap, pxPerDay, chartW, neededHeight, viewportH };
        }, [spanDias, proyectos.length]);

        // Helpers
        const proyectosOrdenados = useMemo(()=>[...proyectos].sort((a,b)=>a.inicio-b.inicio), [proyectos]);
        const updateProyecto = (id, patch) => setProyectos(prev=>prev.map(p=>p.id===id?{...p,...patch}:p));
        const addProyecto = () => {
          if (!nuevo.nombre.trim()) return;
          const nuevoProyecto = {
            id: crypto.randomUUID(),
            nombre: nuevo.nombre.trim(),
            inicio: parseISODate(nuevo.inicioISO),
            inicioISO: nuevo.inicioISO,
            duracion: Math.max(1, Number(nuevo.duracion)||1),
            estado: nuevo.estado,
            cliente: nuevo.cliente,
          };
          setProyectos(arr=>[...arr,nuevoProyecto]);
          setNuevo({ nombre:"", inicioISO:new Date().toISOString().slice(0,10), duracion:7, estado:"Pendiente", cliente:clientes[0]||"" });
        };
        const removeProyecto = (id) => setProyectos(prev=>prev.filter(p=>p.id!==id));

        // Eje X (ticks)
        function generateTicks() {
          const ticks = [];
          if (spanDias <= 31) {
            for (let i=0;i<spanDias;i++) ticks.push(addDays(minInicio,i));
          } else if (spanDias <= 180) {
            let d=new Date(minInicio);
            while (d.getDay()!==1) d=addDays(d,1);
            while (d<=maxFin) { ticks.push(new Date(d)); d=addDays(d,7); }
          } else {
            let d=new Date(minInicio.getFullYear(),minInicio.getMonth(),1);
            while (d<=maxFin) { ticks.push(new Date(d)); d=new Date(d.getFullYear(), d.getMonth()+1, 1); }
          }
          return ticks;
        }
        const ticks = useMemo(generateTicks, [minInicio, maxFin, spanDias]);

        const gridDays = useMemo(()=>{
          const arr=[]; for(let i=0;i<spanDias;i++) arr.push(addDays(minInicio,i)); return arr;
        }, [minInicio, spanDias]);

        const hoy = useMemo(()=>{ const t=new Date(); t.setHours(0,0,0,0); return t; }, []);

        return (
          <div className="mx-auto max-w-[1200px] space-y-4">
            <h1 className="text-2xl font-bold text-white">Cronograma de proyectos</h1>

            {/* Formulario */}
            <div className="flex flex-wrap gap-2 items-end card p-3 rounded">
              <div><label>Nombre</label><input className="border p-1 ml-2" value={nuevo.nombre} onChange={e=>setNuevo({...nuevo,nombre:e.target.value})}/></div>
              <div><label>Inicio</label><input type="date" className="border p-1 ml-2" value={nuevo.inicioISO} onChange={e=>setNuevo({...nuevo,inicioISO:e.target.value})}/></div>
              <div><label>Duración (días hábiles)</label><input type="number" className="border p-1 ml-2 w-24" value={nuevo.duracion} onChange={e=>setNuevo({...nuevo,duracion:e.target.value})}/></div>
              <div><label>Estado</label><select className="border p-1 ml-2" value={nuevo.estado} onChange={e=>setNuevo({...nuevo,estado:e.target.value})}>{STATUS.map(s=><option key={s.value}>{s.value}</option>)}</select></div>
              <div><label>Cliente</label><select className="border p-1 ml-2" value={nuevo.cliente} onChange={e=>setNuevo({...nuevo,cliente:e.target.value})}>{BASE_CLIENTES.map(c=><option key={c}>{c}</option>)}</select></div>
              <button onClick={addProyecto} className="bg-blue-600 text-white px-2 py-1 flex items-center gap-1 rounded"><IconPlus/>Añadir</button>
            </div>

            {/* Tabla */}
            <div className="overflow-x-auto card p-2 rounded">
              <table className="w-full text-sm border">
                <thead><tr className="bg-gray-100"><th>Nombre</th><th>Inicio</th><th>Duración (hábiles)</th><th>Estado</th><th>Cliente</th><th></th></tr></thead>
                <tbody>
                  {proyectosOrdenados.map(p=>(
                    <tr key={p.id}>
                      <td>{p.nombre}</td>
                      <td>{p.inicioISO}</td>
                      <td>{p.duracion}</td>
                      <td>
                        <select value={p.estado} onChange={e=>updateProyecto(p.id,{estado:e.target.value})}>
                          {STATUS.map(s=><option key={s.value}>{s.value}</option>)}
                        </select>
                      </td>
                      <td>
                        <select value={p.cliente} onChange={e=>updateProyecto(p.id,{cliente:e.target.value})}>
                          {BASE_CLIENTES.map(c=><option key={c}>{c}</option>)}
                        </select>
                      </td>
                      <td><button className="text-red-600 flex items-center gap-1" onClick={()=>removeProyecto(p.id)}><IconTrash/>Eliminar</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Leyenda */}
            <div className="flex gap-4 items-center card p-2 rounded">
              {STATUS.map(s=>(
                <div key={s.value} className="flex items-center gap-2 text-sm">
                  <span style={{backgroundColor:s.fill}} className="inline-block w-4 h-4 rounded-sm"></span>{s.value}
                </div>
              ))}
              <div className="ml-auto flex items-center gap-2 text-sm text-slate-600"><IconCalendar/> Calendario desde {fmtDMY(minInicio)}</div>
            </div>

            {/* Gantt con columna fija y scroll horizontal */}
            <div className="relative rounded-2xl border card shadow-sm flex" style={{ maxHeight: `${layout.viewportH}px` }}>
              {/* Columna fija */}
              <div className="sticky left-0 z-10 bg-white border-r" style={{minWidth: `${layout.leftCol}px`, paddingTop: "32px"}}>
                {proyectosOrdenados.map((p, idx) => (
                  <div key={p.id} style={{height: `${layout.rowH + layout.rowGap}px`, display:"flex", flexDirection:"column", justifyContent:"center", padding:"0 8px", borderBottom:"1px solid #eee"}}>
                    <div style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.2 }}>{p.nombre}</div>
                    <div style={{ fontSize: 11, color: "#64748b", marginTop: 2 }}>
                      {fmtDMY(p.inicio)}
                      {p.cliente && <span style={{ marginLeft: 6, fontSize: 11, background: "#eef2ff", border: "1px solid #e0e7ff", padding: "2px 6px", borderRadius: 9999 }}>{p.cliente}</span>}
                    </div>
                  </div>
                ))}
              </div>

              {/* Área SVG scrolleable */}
              <div className="overflow-x-auto overflow-y-auto">
                <svg className="block" width={layout.chartW + layout.rightPad} height={layout.neededHeight}>
                  {/* Rejilla y fines de semana */}
                  {gridDays.map((d,i)=>{
                    const x = diffDays(d, minInicio) * layout.pxPerDay;
                    const weekend = isWeekend(d);
                    return (
                      <g key={i}>
                        {weekend && <rect x={x} y={0} width={layout.pxPerDay} height={layout.neededHeight - layout.bottomAxis} fill="#f1f5f9" />}
                        <line x1={x} y1={0} x2={x} y2={layout.neededHeight - layout.bottomAxis} stroke="#e5e7eb" />
                      </g>
                    );
                  })}

                  {/* Línea de hoy */}
                  {(() => {
                    const t = hoy;
                    if (t >= minInicio && t <= maxFin) {
                      const x = diffDays(t, minInicio) * layout.pxPerDay;
                      return (<g><line x1={x} y1={0} x2={x} y2={layout.neededHeight - layout.bottomAxis} stroke="#ef4444" strokeDasharray="4 4"/><text x={x+4} y={12} fontSize={10} fill="#ef4444">Hoy</text></g>);
                    }
                    return null;
                  })()}

                  {/* Barras */}
                  {proyectosOrdenados.map((p, idx) => {
                    const y = 32 + idx * (layout.rowH + layout.rowGap) + 4;
                    const startX = diffDays(p.inicio, minInicio) * layout.pxPerDay;
                    const endDate = addBusinessDays(p.inicio, Math.max(1, p.duracion) - 1);
                    const w = (diffDays(endDate, p.inicio) + 1) * layout.pxPerDay;
                    const color = STATUS_COLOR[p.estado] || "#6b7280";
                    return (
                      <g key={p.id}>
                        <rect x={startX + 1} y={y} width={w - 2} height={layout.rowH - 14} rx={8} fill={color} />
                        <text x={startX + 8} y={y + (layout.rowH - 14) / 2 + 4} fill="white" style={{ fontSize: 12, fontWeight: 600 }}>{p.duracion} d</text>
                        <title>{`${p.nombre}\n${fmtDMY(p.inicio)} → ${fmtDMY(endDate)}\n${p.duracion} días hábiles | ${p.cliente || "Sin cliente"}`}</title>
                      </g>
                    );
                  })}

                  {/* Eje X */}
                  <line x1="0" y1={layout.neededHeight - layout.bottomAxis} x2={layout.chartW} y2={layout.neededHeight - layout.bottomAxis} stroke="#000" />
                  {ticks.map((d,i)=>{
                    const x = diffDays(d, minInicio) * layout.pxPerDay;
                    let label = "";
                    if (spanDias <= 31) label = d.toLocaleDateString(undefined, {day:"2-digit", month:"2-digit"});
                    else if (spanDias <= 180) label = d.toLocaleDateString(undefined, {day:"2-digit", month:"short"});
                    else label = d.toLocaleDateString(undefined, {month:"short", year:"numeric"});
                    return (<g key={i}><line x1={x} y1={layout.neededHeight - layout.bottomAxis} x2={x} y2={layout.neededHeight - layout.bottomAxis + 6} stroke="#000" /><text x={x+2} y={layout.neededHeight - layout.bottomAxis + 20} fontSize="10">{label}</text></g>);
                  })}
                </svg>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
